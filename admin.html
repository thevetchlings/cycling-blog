<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add entry — Waypoints</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="admin-wrap">
  <h1 class="wordmark">Add an entry</h1>
  <p class="subhead" style="margin-bottom:2rem;">Fills in <code>posts.json</code> and publishes automatically.</p>

  <div class="token-box" id="tokenBox">
    <div id="tokenPrompt">
      <p style="margin:0 0 0.7rem;">Paste your GitHub access token to connect this form to your repo (only needed once — it's saved in this browser).</p>
      <div class="field">
        <input type="password" id="tokenInput" placeholder="github_pat_...">
      </div>
      <button class="primary" id="saveTokenBtn" type="button">Save token</button>
    </div>
    <div id="tokenConnected" style="display:none;">
      <span>✓ Connected to GitHub</span>
      <button class="link-btn" id="forgetTokenBtn" type="button" style="margin-left:1rem;">Forget token</button>
    </div>
  </div>

  <form id="entryForm">
    <div class="field">
      <label for="type">Type</label>
      <select id="type">
        <option value="life">Life event</option>
        <option value="ride">Ride</option>
      </select>
    </div>

    <div class="field">
      <label for="date">Date</label>
      <input type="date" id="date" required>
    </div>

    <div class="field">
      <label for="title">Title</label>
      <input type="text" id="title" placeholder="e.g. Sunday loop round the coast" required>
    </div>

    <div class="field">
      <label for="body">What happened</label>
      <textarea id="body" placeholder="Write as much or as little as you like. Leave a blank line between paragraphs."></textarea>
    </div>

    <div class="stats-fields hidden" id="statsFields">
      <div class="field">
        <label for="distance">Distance</label>
        <input type="text" id="distance" placeholder="42 km">
      </div>
      <div class="field">
        <label for="elevation">Elevation</label>
        <input type="text" id="elevation" placeholder="380 m">
      </div>
      <div class="field">
        <label for="time">Time</label>
        <input type="text" id="time" placeholder="1h 48m">
      </div>
    </div>

    <div class="field" id="komootField" style="display:none;">
      <label for="komoot">Komoot link (optional)</label>
      <input type="url" id="komoot" placeholder="https://www.komoot.com/tour/...">
    </div>

    <button class="primary" type="submit" id="submitBtn">Publish entry</button>
  </form>

  <div class="status-msg hidden" id="statusMsg"></div>

  <a class="back-link" href="index.html">← Back to the log</a>
</div>

<script src="admin.js"></script>
</body>
</html>
