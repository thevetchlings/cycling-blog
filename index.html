<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waypoints — a riding &amp; life log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <h1 class="wordmark">Waypoints</h1>
    <p class="subhead">A running log of rides and everything alongside them.</p>
  </div>
  <div class="filter-row" role="tablist" aria-label="Filter entries">
    <button class="filter-btn active" data-filter="all" role="tab" aria-selected="true">All entries</button>
    <button class="filter-btn" data-filter="ride" role="tab" aria-selected="false">Rides only</button>
    <button class="filter-btn" data-filter="life" role="tab" aria-selected="false">Life only</button>
  </div>
</header>

<main class="log" id="log">
  <div class="log-line" aria-hidden="true"></div>
  <div id="entries"></div>
</main>

<footer class="site-footer">
  <p>Built as a static log. Edit <code>posts.json</code> to add entries — see the README.</p>
</footer>

<script src="app.js"></script>
</body>
</html>
